<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2 Cars">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>2 Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: arcade at night, quick and clean
IDEA: a two-lane highway seen from above, neon paint on dark asphalt
PICTURE: the game canvas itself, full screen
COLOUR and TYPE: night asphalt #161a3a, coral car #ff5a64, aqua car #2fd4e0, white HUD; Chakra Petch
LAYOUT: canvas fills the phone; menus float over the road as one centered card
*/
:root{--bg:#0d1029;--road:#1b2048;--ink:#f4f6ff;--muted:#a9b0d8;--red:#ff5a64;--blue:#2fd4e0;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  font:16px/1.4 "Chakra Petch",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#1a1f4a,#0b0d22)}
#stage{position:relative;height:100%;width:100%;max-width:calc(100dvh * .62)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;justify-content:center;pointer-events:none}
#score{padding:2px 16px 6px;border-radius:16px;background:rgba(8,10,28,.45);font-size:56px;font-weight:700;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#pauseBtn{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 10px);width:44px;height:44px;border:0;border-radius:12px;
  background:rgba(255,255,255,.08);color:var(--ink);pointer-events:auto;display:none;align-items:center;justify-content:center;cursor:pointer}
#pauseBtn svg{width:18px;height:18px}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(8,10,28,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.on{display:flex}
.card{width:min(340px,100%);background:rgba(22,26,60,.94);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{margin:0;font-size:44px;line-height:1.05;letter-spacing:.5px}
h1 .r{color:var(--red)}h1 .b{color:var(--blue)}
h2{margin:0 0 4px;font-size:32px;line-height:1.05}
.sub{color:var(--muted);font-size:14px;margin:8px 0 18px}
.big{font-size:64px;font-weight:700;line-height:1}
.best{color:var(--muted);font-size:15px;margin:6px 0 18px}
.best b{color:var(--ink)}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;font:700 19px "Chakra Petch",system-ui,sans-serif;color:#10132d;
  background:linear-gradient(90deg,var(--red),#ff8a6b 50%,var(--blue) 50.1%,#7fe9f0);cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.tog:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lbl{text-align:left;font-size:13px;color:var(--muted);margin:18px 2px 8px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.chips.modes{grid-template-columns:repeat(2,minmax(0,1fr))}#themes{grid-template-columns:repeat(3,minmax(0,1fr))}
.chip{min-height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--ink);font:600 13px "Chakra Petch",system-ui,sans-serif;cursor:pointer;line-height:1.1;padding:4px 2px}
.chip small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.chip.on{background:var(--ink);color:#141834}.chip.on small{color:#4a5080}
.row{display:flex;gap:6px;margin-top:6px}
.tog{flex:1;min-height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);font:600 13px "Chakra Petch",system-ui,sans-serif;cursor:pointer}
.tog.on{color:var(--ink);border-color:rgba(255,255,255,.4)}
.how{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:13px;margin:4px 0 0}
.how span{display:flex;align-items:center;gap:6px}
.chip:disabled{opacity:.45;cursor:default}
.unlock{margin:-8px 0 16px;font-weight:700;color:#ffd166}
.ver{color:var(--muted);font-size:12px;margin:12px 0 0;opacity:.7}
.tiny{color:var(--muted);font-size:12px;margin:14px 0 0}
@media (pointer:coarse){.tiny{display:none}}
@media (max-height:720px){.card{padding:16px 16px 14px}h1{font-size:34px}.sub{margin:4px 0 10px}.lbl{margin:10px 2px 6px}.best{margin:4px 0 10px}.chip{min-height:40px}.tog{min-height:40px}.btn{min-height:48px}}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div id="wrap" style="background:#0d1029"><div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"><div id="score" hidden>0</div></div>
  <button id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 18 18" fill="currentColor"><rect x="3" y="2" width="4" height="14" rx="1"/><rect x="11" y="2" width="4" height="14" rx="1"/></svg></button>

  <div class="ov on" id="menu"><div class="card">
    <h1><span class="r">2</span> <span class="b">Cars</span></h1>
    <p class="sub">Tap the left or right half to switch that car's lane.</p>
    <div class="lbl" style="margin-top:0">Mode</div>
    <div class="chips modes" id="modes"></div>
    <div class="how" style="margin-top:14px">
      <span id="howCircle"><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#f4f6ff" stroke-width="2.5"/></svg>Catch every circle</span>
      <span><svg width="14" height="14"><rect x="1.5" y="1.5" width="11" height="11" rx="2" fill="none" stroke="#f4f6ff" stroke-width="2.5"/></svg>Dodge squares</span>
    </div>
    <div class="lbl">Theme</div>
    <div class="chips" id="themes"></div>
    <div class="lbl">Lane switch speed</div>
    <div class="chips" id="speeds"></div>
    <div class="row"><button class="tog" id="sndBtn">Sound</button><button class="tog" id="musBtn">Music</button><button class="tog" id="vibBtn">Vibrate</button></div>
    <p class="best"><span id="modeName">Hard</span> best <b id="bestMenu">0</b></p>
    <button class="btn" id="playBtn">Play</button>
    <p class="ver" id="ver"></p>
    <p class="tiny">Keyboard: F / ← left car · J / → right car · Space pause</p>
  </div></div>

  <div class="ov" id="over"><div class="card">
    <h2 id="overWhy">Crashed</h2>
    <div class="big" id="final">0</div>
    <p class="best"><span id="modeOver">Hard</span> best <b id="bestOver">0</b></p>
    <p class="unlock" id="unlockMsg" hidden></p>
    <button class="btn" id="againBtn">Play again</button>
    <div class="row"><button class="tog on" id="menuBtn">Settings</button></div>
  </div></div>

  <div class="ov" id="paused"><div class="card">
    <h2>Paused</h2>
    <p class="sub">Score <b id="pScore">0</b></p>
    <button class="btn" id="resumeBtn">Resume</button>
    <div class="row"><button class="tog on" id="quitBtn">Quit to menu</button></div>
  </div></div>
</div></div>

<script>
{
const cv=document.getElementById('c'),cx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
// Themes unlock from your best score in either mode. Each sets the road, the two car colours,
// the colour the road heats toward as speed climbs, and one moving background layer.
const THEMES=[
  {id:'night',n:'Night City',at:0,  road:['#1d2250','#1a1f45'],cols:['#ff5a64','#2fd4e0'],hot:'255,60,170', lane:'rgba(255,255,255,.22)',div:'rgba(255,255,255,.55)',page:'#0d1029',decor:'lights'},
  {id:'synth',n:'Synthwave', at:50, road:['#2c0f4a','#13062a'],cols:['#ff4fa3','#36e2ff'],hot:'255,130,40', lane:'rgba(255,79,163,.45)', div:'rgba(255,214,102,.85)',page:'#12061f',decor:'grid'},
  {id:'snow', n:'Snow',      at:100,road:['#3a4d75','#2a3858'],cols:['#ff4d5e','#4db2ff'],hot:'190,230,255',lane:'rgba(255,255,255,.5)',  div:'rgba(255,255,255,.85)',page:'#1a2440',decor:'snow'},
  {id:'ausar',n:'Ausar #9',  at:0,  road:['#d6a068','#c48b55'],cols:['#e0223f','#1d4ed8'],hot:'255,90,30',  lane:'rgba(255,255,255,.55)',div:'rgba(255,255,255,.95)',page:'#1a0f08',decor:'court',num:'9',streak:'#5a3214',ball:1},
  {id:'space',n:'Deep Space',at:200,road:['#070820','#0b0c28'],cols:['#ffab40','#a982ff'],hot:'120,80,255', lane:'rgba(169,130,255,.25)',div:'rgba(255,255,255,.35)',page:'#020310',decor:'stars'}];
let theme=THEMES[0];
const th=()=>theme;
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
const SPEEDS=[{n:'Instant',ms:45},{n:'Snappy',ms:85},{n:'Smooth',ms:140},{n:'Classic',ms:230}];
const VERSION='1.9';
const store={get(k,d){try{const v=localStorage.getItem('2cars.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('2cars.'+k,JSON.stringify(v))}catch(e){}}};
const MODES=[{id:'easy',n:'Easy',d:'Dodge squares only'},{id:'hard',n:'Hard',d:'Catch circles + dodge'}];
let cfg={music:store.get('music',true),theme:store.get('theme','night'),mode:store.get('mode','hard'),speed:store.get('speed',1),sound:store.get('sound',true),vib:store.get('vib',true)};
const bestKey=()=>cfg.mode==='easy'?'best_easy':'best';
const easy=()=>cfg.mode==='easy';
let best=store.get(bestKey(),0);
const topBest=()=>Math.max(store.get('best',0),store.get('best_easy',0));
function applyTheme(){theme=THEMES.find(t=>t.id===cfg.theme&&t.at<=topBest())||THEMES[0];$('wrap').style.background=theme.page;
  try{document.querySelector('meta[name=theme-color]').content=theme.page}catch(e){}}

// ---- sizing ----
let W=0,H=0,dpr=1,laneW=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,3);const r=stage.getBoundingClientRect();W=r.width;H=r.height;laneW=W/4;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
  for(const c of cars){c.x=laneX(c.side,c.lane);c.fromX=c.toX=c.x;c.t=1}}
const laneX=(s,l)=>(s*2+l+.5)*laneW;
const carY=()=>H*.8;

// ---- state ----
let fx=[],streaks=[],floats=[],nearFlash=[0,0],roadV=0,lastDt=0,deco=null,state='menu',score=0,objs=[],parts=[],spawnT=[0,0],elapsed=0,shake=0,overT=0,dash=0,missObj=null,crashSide=-1;
const cars=[0,1].map(s=>({side:s,lane:s?0:1,x:0,fromX:0,toX:0,t:1,tilt:0,prevX:0,trail:[]}));

function reset(){score=0;curSpeed=.42;objs=[];parts=[];streaks=[];floats=[];nearFlash=[0,0];elapsed=0;shake=0;missObj=null;crashSide=-1;spawnT=[.5,.5+rand(.25,.45)];
  for(const c of cars){c.lane=c.side?0:1;c.x=c.fromX=c.toX=c.prevX=laneX(c.side,c.lane);c.t=1;c.tilt=0;c.trail=[]}
  $('score').textContent='0'}
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>1-Math.pow(1-t,3);

// ---- the important part: lane switching ----
// Starts the instant the finger touches (pointerdown, not click), uses a short
// ease-out so most of the travel happens in the first few frames, and a second
// tap mid-switch immediately reverses from wherever the car currently is.
function switchLane(s){
  if(state!=='play')return;
  const c=cars[s];c.lane^=1;c.fromX=c.x;c.toX=laneX(s,c.lane);c.t=0;
  c.dur=SPEEDS[cfg.speed].ms/1000*Math.max(.35,Math.abs(c.toX-c.fromX)/laneW);
  tick(s);
}

// ---- difficulty & spawning ----
// Difficulty ramps with score: quick at first, then keeps climbing toward a ceiling.
// Hard: ~1.7x start speed by 20 pts, ~2.4x by 50, ~2.7x by 100. Easy ramps on a gentler curve
// because every dodged square is a point.
function diff(){return 1-Math.exp(-(score/(easy()?60:42)+elapsed/300))}
let curSpeed=.42;
function targetSpeed(){return .42+.78*diff()}           // screen heights per second
function speed(){return H*curSpeed}                    // px per second
function spawn(s){
  const kind=easy()?'s':(Math.random()<.56?'c':'s'),lane=Math.random()<.5?0:1;
  objs.push({side:s,lane,kind,y:-laneW*.5,alive:true,pop:0});
  const d=diff();spawnT[s]=Math.max(.3,rand(.55,.95)*(1-.45*d));
}

// ---- audio / haptics ----
let ac=null;
// iPhone: let game audio play even with the silent switch on while Music is enabled
// (like a native game); with Music off, sound effects follow the switch as usual.
function audioSession(){try{if(navigator.audioSession)navigator.audioSession.type=cfg.music?'playback':'ambient'}catch(e){}}
let unlocked=false;
function ctx(){try{audioSession();if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state!=='running')ac.resume().catch(()=>{});
  // iOS only opens the audio output after something actually plays inside a tap
  if(!unlocked){const b=ac.createBuffer(1,1,22050),src=ac.createBufferSource();src.buffer=b;src.connect(ac.destination);src.start(0);unlocked=ac.state==='running'}
}catch(e){ac=null}return ac}
function audio(){return cfg.sound?ctx():null}

// ---- music: an original synthwave loop composed in code ----
// A 4-bar loop per theme (chords, arpeggio pattern, drums). The menu plays a soft pad + arp;
// a run adds bass and drums; past mid-speed the hats double up and the tempo climbs with the game.
const SONGS={
  night:{bpm:108,prog:[[45,0],[41,1],[48,1],[43,1]],arp:[0,1,2,3,2,1,0,1],aw:'triangle',ao:24,kick:'1000100010001000',pad:0,oct:0},
  synth:{bpm:112,prog:[[50,0],[46,1],[41,1],[48,1]],arp:[0,2,3,2,1,2,3,4],aw:'sawtooth',ao:24,kick:'1000100010001000',pad:1,oct:1},
  snow: {bpm:100,prog:[[40,0],[48,1],[43,1],[38,1]],arp:[3,2,1,0,1,2,4,2],aw:'sine',ao:36,kick:'1000000010100000',pad:1,oct:0},
  ausar:{bpm:96, prog:[[43,0],[39,1],[46,1],[41,1]],arp:[0,0,2,0,3,0,2,1],aw:'square',ao:24,kick:'1000001010000010',pad:0,oct:1},
  space:{bpm:96, prog:[[48,0],[44,1],[51,1],[46,1]],arp:[0,2,1,3,2,4,3,1],aw:'triangle',ao:24,kick:'1000000000100000',pad:1,oct:0}};
const mus={on:false,step:0,next:0,timer:null,out:null,nb:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musOut(a){if(mus.out)return mus.out;const comp=a.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
  mus.out=a.createGain();mus.out.gain.value=0;mus.out.connect(comp).connect(a.destination);
  const b=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;mus.nb=b;return mus.out}
function env(a,t,peak,att,dec){const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);g.connect(mus.out);return g}
function tone(a,t,f,type,peak,att,dec,cut){const o=a.createOscillator();o.type=type;o.frequency.value=f;let n=o;
  if(cut){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl}n.connect(env(a,t,peak,att,dec));o.start(t);o.stop(t+att+dec+.05)}
function noise(a,t,type,freq,peak,dec){const src=a.createBufferSource();src.buffer=mus.nb;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=freq;
  src.connect(fl).connect(env(a,t,peak,.002,dec));src.start(t);src.stop(t+dec+.05)}
function kick(a,t){const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);o.connect(env(a,t,.9,.003,.24));o.start(t);o.stop(t+.3)}
function songBpm(){const sg=SONGS[th().id];return sg.bpm*(state==='play'?1+.28*heat():1)}
function schedStep(a,st,t){
  const sg=SONGS[th().id],s=st%16,[root,maj]=sg.prog[Math.floor(st/16)%4],tri=[root,root+(maj?4:3),root+7,root+12,root+(maj?16:15)];
  const lvl=state==='play'?(heat()>.45?2:1):0,sixteenth=60/songBpm()/4;
  if(s===0&&(sg.pad||lvl===0))for(const m of tri.slice(0,3))for(const det of [-6,6]){const o=a.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m+12);o.detune.value=det;
    const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=800;const g=a.createGain(),len=sixteenth*16;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(lvl?.03:.05,t+len*.25);g.gain.linearRampToValueAtTime(.0001,t+len);o.connect(fl).connect(g).connect(mus.out);o.start(t);o.stop(t+len+.05)}
  if(lvl>0||s%2===0)tone(a,t,mtof(tri[sg.arp[s%8]]+sg.ao+(lvl===2&&s>=8?12:0)),sg.aw,lvl?.07:.09,.006,sixteenth*1.6,sg.aw==='sawtooth'?2200+2600*heat():0);
  if(lvl===0)return;
  if(s%2===0)tone(a,t,mtof(root-12+(sg.oct&&s%4===2?12:0)),'sawtooth',.13,.008,sixteenth*1.7,520);
  if(sg.kick[s]==='1')kick(a,t);
  if(s===4||s===12){noise(a,t,'bandpass',1800,.32,.13);tone(a,t,190,'triangle',.12,.002,.06)}
  if(s%4===2||(lvl===2&&s%2===1))noise(a,t,'highpass',7500,s%4===2?.11:.06,.035);
}
function musTick(){const a=ac;if(!a||!mus.on)return;while(mus.next<a.currentTime+.15){schedStep(a,mus.step,mus.next);mus.next+=60/songBpm()/4;mus.step=(mus.step+1)%64}}
function musRestart(){if(!ac||!mus.on)return;mus.step=0;mus.next=ac.currentTime+.06}
function updateMusic(){
  const a=ac;if(!a)return;musOut(a);
  const want=cfg.music&&state!=='paused'&&!document.hidden;
  if(want&&!mus.on){mus.on=true;mus.step=0;mus.next=a.currentTime+.06;mus.timer=setInterval(musTick,25)}
  if(!want&&mus.on){mus.on=false;clearInterval(mus.timer)}
  const vol=!want?0:state==='play'?.85:state==='dying'||state==='over'?.6:1;
  if(Math.abs(mus.out.gain.value-vol)>.01)mus.out.gain.setTargetAtTime(vol,a.currentTime,.25);
}
function beep(f,dur,type,vol,slide){const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur)}catch(e){}}
function tick(s){beep(s?520:440,.05,'triangle',.05)}
function ding(){beep(660+Math.min(score,60)*9,.12,'sine',.12,990+Math.min(score,60)*9)}
function boom(){beep(180,.45,'sawtooth',.18,40)}
function buzz(ms){if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

// ---- loop ----
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  lastDt=dt;roadV=state==='play'?speed():state==='menu'?H*.35:0;
  if(state==='play')update(dt);else if(state==='dying'){overT+=dt;updateParts(dt);shake=Math.max(0,shake-dt*2.5);if(overT>.7)showOver()}
  else if(state==='menu'){dash+=dt*roadV;idleCars(dt)}
  updateFx(dt);
  updateMusic();draw();requestAnimationFrame(frame);
}
function idleCars(dt){for(const c of cars)moveCar(c,dt)}
function moveCar(c,dt){
  c.prevX=c.x;
  if(c.t<1){c.t=Math.min(1,c.t+dt/c.dur);c.x=c.fromX+(c.toX-c.fromX)*ease(c.t);
    // drop ghost copies along the path; they ride the road downward and fade
    const steps=Math.max(1,Math.ceil(Math.abs(c.x-c.prevX)/(laneW*.12)));
    for(let i=1;i<=steps;i++)c.trail.push({x:c.prevX+(c.x-c.prevX)*i/steps,dy:0,tilt:c.tilt,t:0})}
  const v=dt>0?(c.x-c.prevX)/dt:0;const target=Math.max(-.5,Math.min(.5,v/(laneW*9)));
  c.tilt+=(target-c.tilt)*Math.min(1,dt*30);
}
function update(dt){
  elapsed+=dt;curSpeed+=(targetSpeed()-curSpeed)*Math.min(1,dt*2.5);const v=speed();dash+=v*dt;
  for(let s=0;s<2;s++){spawnT[s]-=dt;if(spawnT[s]<=0)spawn(s)}
  for(const c of cars)moveCar(c,dt);
  const cy=carY(),ch=laneW*.78,cw=laneW*.42,sz=laneW*.46;
  for(const o of objs){
    o.y+=v*dt;if(!o.alive){o.pop+=dt;continue}
    const c=cars[o.side],ox=laneX(o.side,o.lane);
    // forgiving hitbox: squares shrink a bit, circles grow a bit
    const k=o.kind==='s'?.78:1.12,hw=(cw/2+sz/2*k)*(o.kind==='s'?.92:1),hh=ch/2+sz/2*k;
    if(o.kind==='s'&&Math.abs(cy-o.y)<hh)o.gap=Math.min(o.gap??1e9,Math.abs(c.x-ox)-hw);
    if(Math.abs(c.x-ox)<hw&&Math.abs(cy-o.y)<hh){
      if(o.kind==='c'){o.alive=false;score++;$('score').textContent=score;ding();burst(ox,o.y,o.side,10)}
      else return die(o.side,'Crashed',o);
    }else if(o.kind==='c'&&o.y-sz/2>cy+ch/2+4){return die(o.side,'Missed a circle',o)}
    else if(o.kind==='s'&&!o.passed&&o.y-sz/2>cy+ch/2){o.passed=true;
      if(easy()){score++;$('score').textContent=score;beep(560+Math.min(score,80)*6,.07,'sine',.06)}
      if(o.gap<laneW*.3)nearMiss(o.side)}
  }
  objs=objs.filter(o=>o.y<H+laneW&&(o.alive||o.pop<.3));
  updateParts(dt);
}
function nearMiss(s){nearFlash[s]=1;floats.push({x:cars[s].x,y:carY()-laneW*.7,txt:'Close!',t:0,s});
  beep(1400,.16,'triangle',.07,500);buzz(12)}
function die(side,why,o){
  state='dying';overT=0;shake=1;crashSide=side;missObj=o;$('overWhy').textContent=why;
  boom();buzz([60,40,90]);burst(cars[side].x,carY(),side,26);$('pauseBtn').style.display='none';
}
function showOver(){
  state='over';const before=topBest();if(score>best){best=score;store.set(bestKey(),best)}
  const fresh=THEMES.filter(t=>t.at>before&&t.at<=topBest());
  $('unlockMsg').hidden=!fresh.length;if(fresh.length)$('unlockMsg').textContent='New theme unlocked: '+fresh.map(t=>t.n).join(', ');
  $('final').textContent=score;$('bestOver').textContent=best;$('bestMenu').textContent=best;
  $('over').classList.add('on');$('score').hidden=true;overShownAt=performance.now();if(window.__maybeReload)setTimeout(window.__maybeReload,1500);
}
let overShownAt=0;

// ---- particles ----
function burst(x,y,s,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=rand(80,320);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.3,.6),t:0,s})}}
function updateParts(dt){for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92}parts=parts.filter(p=>p.t<p.life)}

// ---- ambient effects ----
const heat=()=>Math.max(0,Math.min(1,(curSpeed-.42)/.78));
function initDeco(){deco={flakes:Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:rand(.8,2.6),w:rand(0,6.3)})),
  stars:Array.from({length:110},(_,i)=>({x:Math.random(),y:Math.random(),l:i%3,r:[.6,1,1.6][i%3]}))}}
function updateFx(dt){
  if(!deco)initDeco();
  for(const c of cars){for(const g of c.trail){g.t+=dt;g.dy+=roadV*.6*dt}c.trail=c.trail.filter(g=>g.t<.16)}
  for(let s=0;s<2;s++)nearFlash[s]=Math.max(0,nearFlash[s]-dt*3.5);
  for(const f of floats){f.t+=dt;f.y-=60*dt}floats=floats.filter(f=>f.t<.7);
  // speed lines: none at start speed, a steady rain of long streaks near top speed
  const h=state==='play'?heat():0;
  if(h>.08){const n=h*45*dt;for(let k=0;k<Math.floor(n)+(Math.random()<n%1?1:0);k++){
    const lane=Math.floor(Math.random()*5),x=lane*laneW+rand(-laneW*.12,laneW*.12);   // gutters + lane lines
    streaks.push({x:Math.max(2,Math.min(W-2,x)),y:-40,len:rand(.08,.2)*H*(.4+h),a:rand(.06,.18)*(.5+h)})}}
  for(const k of streaks)k.y+=roadV*1.6*dt;streaks=streaks.filter(k=>k.y-k.len<H);
  const v=roadV/H;
  for(const f of deco.flakes){f.y+=(v*.85+.12)*dt;f.w+=dt*1.7;if(f.y>1.02){f.y=-.02;f.x=Math.random()}}
  for(const st of deco.stars){st.y+=v*[.15,.35,.7][st.l]*dt;if(st.y>1){st.y=0;st.x=Math.random()}}
}

// ---- drawing ----
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function drawDecor(t){
  if(t.decor==='lights'){   // street lamps sliding past both edges
    const gap=H/3.2;for(let y=(dash*.9)%gap-gap;y<H+gap;y+=gap)for(const x of [3,W-3]){
      const g=cx.createRadialGradient(x,y,0,x,y,laneW*.55);g.addColorStop(0,'rgba(255,200,120,.28)');g.addColorStop(1,'rgba(255,200,120,0)');
      cx.fillStyle=g;cx.fillRect(x-laneW*.6,y-laneW*.6,laneW*1.2,laneW*1.2);cx.fillStyle='#ffe2b0';cx.fillRect(x-2,y-2,4,4)}}
  else if(t.decor==='grid'){ // retro sun + scrolling floor grid
    const g=cx.createRadialGradient(W/2,-H*.02,0,W/2,-H*.02,W*.8);g.addColorStop(0,'rgba(255,170,60,.38)');g.addColorStop(.5,'rgba(255,60,150,.12)');g.addColorStop(1,'rgba(255,60,150,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H*.6);
    const gs=H/12;cx.fillStyle='rgba(255,79,163,.13)';for(let y=dash%gs-gs;y<H;y+=gs)cx.fillRect(0,y,W,2);
    for(let i=1;i<8;i+=2)cx.fillRect(i*W/8-1,0,2,H)}
  else if(t.decor==='snow'){ // snowbanks + falling flakes
    for(const [x,d] of [[0,1],[W,-1]]){const g=cx.createLinearGradient(x,0,x+d*14,0);g.addColorStop(0,'rgba(240,248,255,.75)');g.addColorStop(1,'rgba(240,248,255,0)');cx.fillStyle=g;cx.fillRect(Math.min(x,x+d*14),0,14,H)}
    cx.fillStyle='rgba(255,255,255,.85)';for(const f of deco.flakes){cx.beginPath();cx.arc(f.x*W+Math.sin(f.w)*6,f.y*H,f.r,0,7);cx.fill()}}
  else if(t.decor==='court'){ // hardwood planks + court markings scrolling past + arena vignette
    const bw=W/12,pl=H*.45;
    for(let b=0;b<12;b++){if(b%2){cx.fillStyle='rgba(90,45,10,.06)';cx.fillRect(b*bw,0,bw,H)}
      cx.fillStyle='rgba(80,40,10,.22)';cx.fillRect(b*bw,0,1,H);
      for(let y=(dash+b*137)%pl-pl;y<H;y+=pl)cx.fillRect(b*bw,y,bw,1.5)}
    const L=H*2.4,p=dash%L;cx.strokeStyle='rgba(255,255,255,.92)';cx.lineWidth=3;
    for(let k=-1;k<=1;k++){const yb=p+k*L;if(yb>H+H*.5||yb+L<-H*.5)continue;
      cx.fillStyle='rgba(29,78,216,.55)';cx.fillRect(W*.29,yb,W*.42,H*.36);cx.strokeRect(W*.29,yb,W*.42,H*.36);
      cx.beginPath();cx.arc(W/2,yb+H*.36,W*.21,0,Math.PI);cx.stroke();
      cx.beginPath();cx.arc(W/2,yb+H*.05,W*.46,.05,Math.PI-.05);cx.stroke();
      cx.fillStyle='rgba(224,34,63,.5)';cx.beginPath();cx.arc(W/2,yb+L/2,W*.17,0,7);cx.fill();cx.stroke();
      cx.fillStyle='rgba(255,255,255,.92)';cx.fillRect(0,yb+L/2-1.5,W,3);
      cx.font='700 '+Math.round(W*.12)+'px "Chakra Petch",system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='rgba(255,255,255,.85)';cx.fillText('9',W/2,yb+L/2+1);cx.textBaseline='alphabetic'}
    const v=cx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(20,8,0,.45)');cx.fillStyle=v;cx.fillRect(0,0,W,H)}
  else if(t.decor==='stars'){ // nebula + three-layer parallax starfield
    const g=cx.createRadialGradient(W*.75,H*.25,0,W*.75,H*.25,W*.9);g.addColorStop(0,'rgba(140,80,255,.16)');g.addColorStop(1,'rgba(140,80,255,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    for(const st of deco.stars){cx.globalAlpha=[.35,.6,.95][st.l];cx.fillStyle='#fff';cx.fillRect(st.x*W,st.y*H,st.r,st.r*(1+st.l*roadV/H*1.5))}cx.globalAlpha=1}
}
function draw(){
  const t=th(),C=t.cols,h=state==='menu'?0:heat();
  cx.save();
  if(shake>0)cx.translate(rand(-1,1)*10*shake,rand(-1,1)*10*shake);
  // road
  let g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,t.road[0]);g.addColorStop(1,t.road[1]);cx.fillStyle=g;cx.fillRect(-20,-20,W+40,H+40);
  for(let s=0;s<2;s++){g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba('+rgb(C[s])+',0.02)');g.addColorStop(1,'rgba('+rgb(C[s])+',0.09)');cx.fillStyle=g;cx.fillRect(s*W/2,0,W/2,H)}
  // heat: the road warms toward the theme's hot colour as speed climbs
  if(h>0){g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba('+t.hot+','+(.3*h)+')');g.addColorStop(1,'rgba('+t.hot+','+(.08*h)+')');cx.fillStyle=g;cx.fillRect(-20,-20,W+40,H+40)}
  drawDecor(t);
  // dashed lane lines (scroll with speed)
  const seg=H/9,off=dash%seg;cx.fillStyle=t.lane;
  for(const lx of [W/4,W*3/4])for(let y=-seg+off;y<H;y+=seg)rr(lx-1.5,y,3,seg*.55,1.5),cx.fill();
  cx.fillStyle=t.div;cx.fillRect(W/2-2,0,4,H);
  // speed lines
  cx.strokeStyle=t.streak||'#fff';cx.lineWidth=1.5;for(const k of streaks){cx.globalAlpha=k.a;cx.beginPath();cx.moveTo(k.x,k.y-k.len);cx.lineTo(k.x,k.y);cx.stroke()}cx.globalAlpha=1;
  // objects
  const sz=laneW*.46,glow=14+18*h;
  for(const o of objs){
    const x=laneX(o.side,o.lane),col=C[o.side];
    if(!o.alive){const k=o.pop/.3;cx.globalAlpha=1-k;cx.strokeStyle=col;cx.lineWidth=3;cx.beginPath();cx.arc(x,o.y,sz/2*(1+k*1.4),0,7);cx.stroke();cx.globalAlpha=1;continue}
    const flash=o===missObj&&state!=='play'?(Math.sin(performance.now()/60)>0?1:.35):1;cx.globalAlpha=flash;
    cx.shadowColor=col;cx.shadowBlur=glow;
    if(o.kind==='c'&&t.ball){const R=sz/2;cx.fillStyle=col;cx.beginPath();cx.arc(x,o.y,R+3,0,7);cx.fill();cx.shadowBlur=0;
      const bg=cx.createRadialGradient(x-R*.35,o.y-R*.35,R*.1,x,o.y,R);bg.addColorStop(0,'#ffa25a');bg.addColorStop(1,'#d2611c');
      cx.fillStyle=bg;cx.beginPath();cx.arc(x,o.y,R-1,0,7);cx.fill();cx.strokeStyle='#2a1406';cx.lineWidth=1.6;
      cx.beginPath();cx.moveTo(x,o.y-R+1);cx.lineTo(x,o.y+R-1);cx.moveTo(x-R+1,o.y);cx.lineTo(x+R-1,o.y);cx.stroke();
      cx.beginPath();cx.arc(x-R*1.15,o.y,R*.85,-.75,.75);cx.stroke();cx.beginPath();cx.arc(x+R*1.15,o.y,R*.85,Math.PI-.75,Math.PI+.75);cx.stroke()}
    else if(o.kind==='c'){cx.fillStyle=col;cx.beginPath();cx.arc(x,o.y,sz/2,0,7);cx.fill();cx.shadowBlur=0;
      cx.fillStyle=t.road[1];cx.beginPath();cx.arc(x,o.y,sz/2-sz*.13,0,7);cx.fill();
      cx.fillStyle=col;cx.beginPath();cx.arc(x,o.y,sz*.16,0,7);cx.fill()}
    else{cx.fillStyle=col;rr(x-sz/2,o.y-sz/2,sz,sz,sz*.16);cx.fill();cx.shadowBlur=0;
      cx.fillStyle=t.road[1];rr(x-sz/2+sz*.13,o.y-sz/2+sz*.13,sz*.74,sz*.74,sz*.08);cx.fill();
      cx.fillStyle=col;rr(x-sz*.16,o.y-sz*.16,sz*.32,sz*.32,sz*.05);cx.fill()}
    cx.globalAlpha=1;cx.shadowBlur=0;
  }
  // lane-switch trails, then cars
  const cw=laneW*.42,chh=laneW*.78,cy=carY();
  for(const c of cars){if(state!=='play'&&state!=='menu'&&c.side===crashSide&&overT>.08)continue;
    cx.fillStyle=C[c.side];for(const gh of c.trail){cx.globalAlpha=.32*(1-gh.t/.16);cx.save();cx.translate(gh.x,cy+gh.dy);cx.rotate(gh.tilt);rr(-cw/2,-chh/2,cw,chh,cw*.32);cx.fill();cx.restore()}
    cx.globalAlpha=1;drawCar(c)}
  // near-miss flash: a white glow on that side's road edge
  for(let s=0;s<2;s++)if(nearFlash[s]>0){const x0=s*W/2;g=cx.createLinearGradient(x0+(s?W/2:0),0,x0+(s?W/2-W*.18:W*.18),0);
    g.addColorStop(0,'rgba(255,255,255,'+(.45*nearFlash[s])+')');g.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=g;cx.fillRect(x0,0,W/2,H)}
  // particles + floating text
  for(const p of parts){cx.globalAlpha=1-p.t/p.life;cx.fillStyle=C[p.s];cx.fillRect(p.x-3,p.y-3,6,6)}
  cx.textAlign='center';cx.font='700 '+Math.round(laneW*.24)+'px "Chakra Petch",system-ui,sans-serif';
  cx.lineWidth=4;cx.strokeStyle='rgba(10,10,30,.6)';for(const f of floats){cx.globalAlpha=1-f.t/.7;cx.strokeText(f.txt,f.x,f.y);cx.fillStyle='#fff';cx.fillText(f.txt,f.x,f.y)}

}
function drawCar(c){
  const w=laneW*.42,h=laneW*.78,y=carY();
  cx.save();cx.translate(c.x,y);cx.rotate(c.tilt);
  // headlight beams
  const g=cx.createLinearGradient(0,-h/2,0,-h/2-h*1.3);g.addColorStop(0,'rgba(255,250,220,.28)');g.addColorStop(1,'rgba(255,250,220,0)');
  cx.fillStyle=g;cx.beginPath();cx.moveTo(-w*.38,-h/2);cx.lineTo(-w*.85,-h/2-h*1.3);cx.lineTo(w*.85,-h/2-h*1.3);cx.lineTo(w*.38,-h/2);cx.fill();
  // shadow
  cx.fillStyle='rgba(0,0,0,.35)';rr(-w/2+3,-h/2+5,w,h,w*.3);cx.fill();
  // wheels
  cx.fillStyle='#0b0d1f';for(const sx of [-1,1])for(const sy of [-.28,.3])rr(sx*w/2-(sx>0?w*.12:w*.06)-0,sy*h-h*.1,w*.18,h*.2,3),cx.fill();
  // body
  const col=th().cols[c.side];
  cx.fillStyle=col;rr(-w/2,-h/2,w,h,w*.32);cx.fill();
  cx.fillStyle='rgba(255,255,255,.18)';rr(-w/2+2,-h/2+2,w*.28,h-4,w*.2);cx.fill();
  // windshield + rear window
  cx.fillStyle='#141834';rr(-w*.36,-h*.2,w*.72,h*.2,w*.12);cx.fill();rr(-w*.32,h*.18,w*.64,h*.12,w*.1);cx.fill();
  // roof
  cx.fillStyle='rgba(0,0,0,.12)';rr(-w*.34,-h*.0,w*.68,h*.18,w*.1);cx.fill();
  if(th().num){cx.font='700 '+Math.round(w*.5)+'px "Chakra Petch",system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.lineWidth=2.5;cx.strokeStyle='rgba(10,10,30,.55)';cx.strokeText(th().num,0,h*.09);cx.fillStyle='#fff';cx.fillText(th().num,0,h*.09);cx.textBaseline='alphabetic'}
  // lights
  cx.fillStyle='#fff6d6';rr(-w*.38,-h/2+2,w*.2,h*.06,2);cx.fill();rr(w*.18,-h/2+2,w*.2,h*.06,2);cx.fill();
  cx.fillStyle='#ff2a3a';rr(-w*.38,h/2-h*.06-1,w*.18,h*.05,2);cx.fill();rr(w*.2,h/2-h*.06-1,w*.18,h*.05,2);cx.fill();
  cx.restore();
}

// pointerdown fires on touch-start (no 300ms click delay); every finger is independent,
// so two thumbs can switch both cars on the same frame.
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();switchLane(e.clientX-r.left<r.width/2?0:1)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(k==='f'||k==='arrowleft'||k==='a'){switchLane(0);e.preventDefault()}
  else if(k==='j'||k==='arrowright'||k==='l'){switchLane(1);e.preventDefault()}
  else if(k===' '||k==='escape'||k==='p'){e.preventDefault();if(state==='play')pause();else if(state==='paused')resume();else if(state==='menu'||state==='over')start()}
  else if(k==='enter'&&(state==='menu'||state==='over'))start();
});

  reset();state='play';$('score').hidden=false;$('pauseBtn').style.display='flex';last=performance.now()}

function resume(){$('paused').classList.remove('on');state='play';last=performance.now()}
function toMenu(){if(window.__maybeReload)window.__maybeReload();renderSettings();state='menu';objs=[];parts=[];$('over').classList.remove('on');$('paused').classList.remove('on');$('menu').classList.add('on');$('score').hidden=true;$('pauseBtn').style.display='none';reset()}

requestAnimationFrame(t=>{last=t;frame(t)});

// offline install when hosted on your own site (ignored inside the claude.ai viewer)
// When a new version is pushed: check for it every time the app comes to the front,
// and swap it in automatically (never in the middle of a run).
let pendingReload=false;
window.__maybeReload=()=>{if(pendingReload&&state!=='play'&&state!=='dying'){pendingReload=false;location.reload()}};
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController)return;pendingReload=true;window.__maybeReload()});
}}catch(e){}
}
