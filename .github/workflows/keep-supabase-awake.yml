# Keeps the free Supabase project (leaderboard) from pausing after a week without activity.
# Runs every 3 days. If Supabase can't be reached (for example it already paused), the run fails
# and GitHub emails you; resume the project in the Supabase dashboard.
name: Keep leaderboard awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # 14:17 UTC every 3rd day
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # only used for the occasional empty "keepalive" commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the leaderboard (counts as database activity)
        env:
          # Supabase's publishable key: designed to be public, read/insert-only by the database rules.
          SB_URL: https://yhokpdesqlfjajxainri.supabase.co
          SB_KEY: sb_publishable_-1okwSzB4u15HLCXszzZvw_luFELvIk
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SB_URL/rest/v1/leaderboard?select=score&limit=1" -H "apikey: $SB_KEY")
          echo "HTTP $code"; cat body.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase answered HTTP $code. If the project is paused, resume it at https://supabase.com/dashboard"
            exit 1
          fi

      - uses: actions/checkout@v4

      # GitHub turns off scheduled workflows in repos with no commits for 60 days.
      # An empty commit every ~50 days of quiet keeps this schedule running.
      - name: Keep this schedule from being disabled
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: keep the leaderboard schedule enabled [skip ci]"
            git push
          fi
